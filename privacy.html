<h1>隱私權政策</h1>
<p>「券商報告共建」是個人自用工具，只由開發者本人使用。</p>
<ul>
<li>透過 Google 授權取得的 Google Drive 存取權，只用來把開發者自己的檔案上傳到開發者自己的 Drive。</li>
<li>不收集、不儲存、不分享任何其他人的資料，也不會把資料提供給第三方。</li>
<li>授權資料只存在開發者自己的電腦上，可隨時在 Google 帳戶的「第三方存取權」撤銷。</li>
</ul>
